name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pytest -q tests
        env:
          TRAVEL_AUTO_BACKUP: 'false'
      - run: node --test tests/*.test.mjs
      - run: pip-audit -r requirements.lock
      - run: docker build -t travel-assistant:test .
      - name: Validate production Compose and Caddy configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.host-proxy.yaml config --quiet
          docker compose run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
