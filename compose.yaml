services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRAVEL_DATA_DIR: /data
      TRAVEL_COOKIE_SECURE: "true"
    expose:
      - "8000"
    volumes:
      - travel-data:/data
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  travel-data:
  caddy-data:
  caddy-config:
